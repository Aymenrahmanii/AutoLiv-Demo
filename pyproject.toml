[project]
name = "coding-buddy"
version = "0.1.0"
description = "Proof of concept: LLM review of R crash-analysis scripts, with and without a codebook"
readme = "README.md"
authors = [
    { name = "Aymenrahmanii", email = "aymen@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.3.0",
    "python-dotenv>=1.2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
coding-buddy = "coding_buddy.cli:main"
coding-buddy-ui = "coding_buddy.web.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.27",
]
